name: Build OpenWrt N30Pro
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/bfdeh/openwrt.git
  REPO_BRANCH: main
  FEED_CONF: feeds.conf.default
  CONFIG_FILE: .config
  UPLOAD_FIRMWARE: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
          python3 python3-pip python3-setuptools python3-dev rsync unzip \
          wget git subversion libz-dev file

      - name: Download OpenWrt source
        run: |
          git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} openwrt
          cd openwrt
          cp ../${{ env.FEED_CONF }} feeds.conf.default
          cp ../${{ env.CONFIG_FILE }} .config

      - name: Update & Install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download package sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) world

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@main
        with:
          name: OpenWrt-N30Pro-Firmware
          path: openwrt/bin/targets/mediatek/filogic
